# Public Roboflow Universe projects used for the retail detector + chocolate-brand gallery.
# The downloader takes each project's latest generated version, reads the licence from the
# export's README, and keeps only permissive licences (allowed_licences). Every box becomes the
# generic class "package" for the detector; chocolate classes are also mapped to brands
# (pvs.training.brands.brand_for). max_images caps very large projects so one source can't dominate.
allowed_licences: ["CC BY 4.0", "CC BY-SA 4.0", "Public Domain", "CC0 1.0", "MIT", "Apache 2.0", "ODbL v1.0"]
