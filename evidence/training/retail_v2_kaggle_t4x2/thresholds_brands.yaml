# Chosen on the VALIDATION split of the public retail datasets (pvs.training.brands); raw cosines,
# not probability-calibrated. Family (brand) level only: sku_score > 1 disables SKU claims.
version: thr-brands-1
calibrated: false
sku_score: 1.01
sku_margin: 0.03
family_score: 0.65
tie_margin: 0.05
template_min_inliers: 14
template_min_spread: 0.12
template_max_reproj_px: 4.0
cue_margin: 0.08
track_hold_s: 1.0
evidence_ttl_s: 0.6
smoother_window_s: 0.5
smoother_min_resultant: 0.8
axis_min_elongation: 1.6
axis_min_extent_px: 40
axis_max_residual: 0.35
quality_min_luma: 25
quality_max_saturated: 0.35
quality_min_sharpness: 8.0
