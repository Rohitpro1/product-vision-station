[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-vision-station"
version = "0.1.0"
description = "Product recognition and orientation station (fixture / pretrained / station profiles)"
requires-python = ">=3.11"
license = {text = "Proprietary - see LICENSE"}
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "pydantic>=2.7",
  "pyyaml>=6",
  "scipy>=1.12",
  "zxing-cpp>=2.2",
  "onnxruntime>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "cryptography>=42",
]

[project.optional-dependencies]
models = ["torch>=2.3", "torchvision>=0.18", "transformers>=4.56", "huggingface_hub>=0.24"]
train = ["torch>=2.3", "torchvision>=0.18", "transformers>=4.56", "onnx>=1.16", "onnxscript>=0.1"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
pvs = "pvs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs downloaded pretrained weights (skipped unless PVS_RUN_MODELS=1)",
  "postgres: needs PVS_PG_DSN",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
